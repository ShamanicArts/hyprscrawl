[package]
name = "scrawl"
version = "0.3.2"
edition = "2024"
default-run = "scrawl"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
cpal = "0.18.2"
dirs = "7.0.0"
flume = "0.12.0"
hound = "3.5.1"
libc = "0.2.189"
png = "0.18.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
core-foundation = "0.10.0"
core-graphics = "0.24.0"
core-graphics-types = "0.1.3"
core-text = "21.0.0"
core-video = "0.4.3"
gpui = { version = "0.2.2", default-features = false, features = ["font-kit"] }
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", features = ["NSPasteboard", "NSPasteboardItem"] }
objc2-core-foundation = "0.3.2"
objc2-foundation = { version = "0.3.2", features = ["NSArray", "NSData", "NSString"] }
objc2-quartz-core = { version = "0.3.2", features = ["CALayer"] }
metal = "0.29.0"
screencapturekit = { version = "=11.0.0", features = ["macos_15_0"] }

[target.'cfg(target_os = "linux")'.dependencies]
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }

[profile.dev]
debug = 0
opt-level = 2

[profile.dev.package."*"]
opt-level = 2

